<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantrailing Ausbildungsheft</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #e74c3c;
            --light: #ecf0f1;
            --dark: #2c3e50;
            --border: #bdc3c7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
            color: var(--dark);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 30px 20px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn-primary {
            background: var(--secondary);
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #229954;
            transform: translateY(-2px);
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn-warning:hover {
            background: #d68910;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .section-title {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 15px 20px;
            margin-top: 30px;
            margin-bottom: 20px;
            border-radius: 6px;
            font-size: 1.5em;
            font-weight: bold;
        }

        .personal-data {
            background: var(--light);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 5px solid var(--secondary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--dark);
            font-size: 0.95em;
        }

        input[type="text"],
        input[type="date"],
        textarea {
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 6px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 8px rgba(52, 152, 219, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        .chapter {
            margin-bottom: 40px;
        }

        .chapter-header {
            background: #ecf0f1;
            padding: 15px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            font-weight: bold;
            font-size: 1.2em;
            color: var(--dark);
            margin-bottom: 15px;
        }

        .chapter-header:hover {
            background: #d5dbdb;
        }

        .chapter-header.open {
            background: var(--secondary);
            color: white;
        }

        .chapter-content {
            display: none;
            padding-left: 20px;
        }

        .chapter-content.open {
            display: block;
        }

        .exercise {
            background: white;
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .exercise:hover {
            border-color: var(--secondary);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.1);
        }

        .exercise.completed {
            background: #d5f4e6;
            border-color: var(--success);
        }

        .exercise-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .exercise-checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: var(--success);
        }

        .exercise-name {
            font-weight: bold;
            font-size: 1.05em;
            flex: 1;
            color: var(--dark);
        }

        .exercise.completed .exercise-name {
            text-decoration: line-through;
            opacity: 0.7;
        }

        .exercise-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            .exercise-fields {
                grid-template-columns: 1fr;
            }
        }

        .exercise-field {
            display: flex;
            flex-direction: column;
        }

        .exercise-field label {
            font-size: 0.85em;
            margin-bottom: 5px;
        }

        .exercise-field input,
        .exercise-field textarea {
            padding: 8px;
            font-size: 0.9em;
        }

        .progress-bar {
            background: var(--light);
            border-radius: 10px;
            height: 30px;
            margin: 20px 0;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            background: linear-gradient(90deg, var(--success) 0%, var(--secondary) 100%);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            transition: width 0.3s ease;
        }

        .footer {
            background: var(--light);
            padding: 20px;
            text-align: center;
            border-top: 2px solid var(--border);
            color: var(--dark);
            font-size: 0.9em;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--secondary) 0%, #5dade2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .stat-card p {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .alert {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #d5f4e6;
            border-left: 4px solid var(--success);
            color: #155e4a;
        }

        .alert-info {
            background: #d6eaf8;
            border-left: 4px solid var(--secondary);
            color: #1a5276;
        }

        .section-subtitle {
            font-size: 1.2em;
            font-weight: bold;
            color: var(--dark);
            margin-top: 25px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐕 Mantrailing Ausbildungsheft</h1>
            <p>Interaktives Trainingsformular mit automatischer Speicherung</p>
        </div>

        <div class="content">
            <!-- Alerts -->
            <div id="alert" class="alert"></div>

            <!-- Button Group -->
            <div class="button-group">
                <button class="btn-primary" onclick="exportPDF()">📥 PDF Export</button>
                <button class="btn-success" onclick="saveData()">💾 Speichern</button>
                <button class="btn-warning" onclick="loadData()">📂 Laden</button>
                <button class="btn-danger" onclick="clearAll()">🗑️ Zurücksetzen</button>
            </div>

            <!-- Personal Data -->
            <div class="personal-data">
                <div class="form-row">
                    <div class="form-group">
                        <label for="dog-name">🐕 Hund</label>
                        <input type="text" id="dog-name" placeholder="Name des Hundes">
                    </div>
                    <div class="form-group">
                        <label for="handler-name">🧑 Halter*in</label>
                        <input type="text" id="handler-name" placeholder="Name des Halters/der Halterin">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="start-date">📅 Beginn der Ausbildung</label>
                        <input type="date" id="start-date">
                    </div>
                    <div class="form-group">
                        <label for="trainer-name">👨‍🏫 Trainer*in</label>
                        <input type="text" id="trainer-name" placeholder="Name des Trainers/der Trainerin">
                    </div>
                </div>
                <div class="form-row full">
                    <div class="form-group">
                        <label for="dog-type">🐶 Suchhundetyp</label>
                        <input type="text" id="dog-type" placeholder="z.B. Mantrailer, Fährtenführer, etc.">
                    </div>
                </div>
            </div>

            <!-- Statistics -->
            <div class="stats" id="stats"></div>

            <!-- Progress Bar -->
            <div class="progress-bar">
                <div class="progress-fill" id="progress" style="width: 0%">
                    <span id="progress-text">0%</span>
                </div>
            </div>

            <!-- Chapters -->
            <div id="chapters"></div>
        </div>

        <div class="footer">
            <p>💾 Deine Daten werden lokal im Browser gespeichert | Version 1.0</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
